services:
  jev-futures-scalper:
    build:
      context: ../../
      dockerfile: services/jev-futures-scalper/Dockerfile
    restart: unless-stopped
    env_file:
      - .env
    environment:
      PORT: "8080"
      DATA_DIR: /data
    ports:
      - "127.0.0.1:${SCALPER_PORT:-8088}:8080"
    volumes:
      - scalper_data:/data
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/health', timeout=3)"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

volumes:
  scalper_data:

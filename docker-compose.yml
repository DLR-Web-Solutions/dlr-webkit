# Optional local stack. Use only when the project benefits from containers
# (database, workers, or containerized deploy). Do not add Compose merely to
# satisfy a rule — omit this file for simple apps that run on the host.

services:
    app:
        build:
            context: .
            dockerfile: Dockerfile
        restart: unless-stopped
        ports:
            - '${APP_PORT:-8000}:${CONTAINER_PORT:-8000}'
        env_file:
            - .env
        environment:
            - PORT=${CONTAINER_PORT:-8000}
            - NODE_ENV=${NODE_ENV:-production}
        depends_on:
            db:
                condition: service_healthy
        healthcheck:
            # Probes the app HTTP /health endpoint (not a runtime version flag).
            test:
                [
                    'CMD',
                    'bun',
                    '-e',
                    "const r=await fetch('http://127.0.0.1:'+(process.env.PORT||8000)+'/health'); if(!r.ok) process.exit(1)",
                ]
            interval: 30s
            timeout: 5s
            retries: 3
            start_period: 15s

    db:
        image: postgres:16-alpine
        restart: unless-stopped
        ports:
            - '${DB_PORT:-5432}:5432'
        environment:
            POSTGRES_DB: ${DB_DATABASE:-app_db}
            POSTGRES_USER: ${DB_USERNAME:-postgres}
            # Required — no default password. Set DB_PASSWORD in .env (see .env.example).
            POSTGRES_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env — do not use compose defaults for secrets}
        volumes:
            - postgres_data:/var/lib/postgresql/data
        healthcheck:
            test:
                ['CMD-SHELL', 'pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB']
            interval: 10s
            timeout: 5s
            retries: 5
            start_period: 10s

volumes:
    postgres_data:
